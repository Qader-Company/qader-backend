services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    image: qader-backend-local-app
    volumes:
      - .:/var/www/html
      - runtime_storage:/var/www/html/storage
      - private_files:/var/www/html/storage/app/private
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - scribe_markdown:/var/www/html/.scribe
      - scribe_views:/var/www/html/resources/views/scribe
      - scribe_assets:/var/www/html/public/vendor
  queue:
    image: qader-backend-local-app
    volumes:
      - .:/var/www/html
      - runtime_storage:/var/www/html/storage
      - private_files:/var/www/html/storage/app/private
      - bootstrap_cache:/var/www/html/bootstrap/cache
  scheduler:
    image: qader-backend-local-app
    volumes:
      - .:/var/www/html
      - runtime_storage:/var/www/html/storage
      - private_files:/var/www/html/storage/app/private
      - bootstrap_cache:/var/www/html/bootstrap/cache
  test:
    image: qader-backend-local-app
    working_dir: /var/www/html
    env_file: .env
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_CONFIG_CACHE: /tmp/qader-backend-phpunit-config.php
      APP_ROUTES_CACHE: /tmp/qader-backend-phpunit-routes-v7.php
      APP_EVENTS_CACHE: /tmp/qader-backend-phpunit-events.php
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DB_URL: ""
      FILESYSTEM_DISK: local
      MAIL_MAILER: array
      PAYMENT_GATEWAY: fake
      PAYMENT_FAKE_WEBHOOK_SECRET: test-payment-secret
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    entrypoint: ["/bin/sh", "/var/www/html/docker/php/run-tests.sh"]
    profiles: [test]
    volumes:
      - .:/var/www/html
      - test_runtime_storage:/var/www/html/storage
      - test_bootstrap_cache:/var/www/html/bootstrap/cache
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      additional_contexts:
        app: service:app
    image: qader-backend-local-nginx
    volumes:
      - scribe_assets:/var/www/html/public/vendor:ro
    ports:
      - "127.0.0.1:8000:80"
  mysql:
    ports:
      - "127.0.0.1:3307:3306"
  redis:
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  runtime_storage: {}
  bootstrap_cache: {}
  scribe_markdown: {}
  scribe_views: {}
  scribe_assets: {}
  test_runtime_storage: {}
  test_bootstrap_cache: {}
